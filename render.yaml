services:
  - type: web
    name: visionguard-ai
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements.txt && pip uninstall -y opencv-python || true
    startCommand: python -m gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: VISIONGUARD_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VISIONGUARD_SECRET_KEY
        generateValue: true
